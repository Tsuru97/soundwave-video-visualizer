name: CI/CD Pipeline - Soundwave Generator

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development

jobs:
  # =========================================================================
  # FASE DE CALIDAD Y VALIDACIÓN (Ramas development y main)
  # Valida dependencias, compilación estática del frontend y build del contenedor
  # =========================================================================
  validate:
    name: Validar Calidad y Compilación
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar Dependencias del Frontend (npm ci)
        working-directory: ./frontend
        run: npm ci

      - name: Verificar Build Estático del Frontend (Vite)
        working-directory: ./frontend
        run: npm run build

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar Compilación del Contenedor Docker (Node 20 Alpine)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: soundwave-frontend:ci-test

  # =========================================================================
  # FASE DE DESPLIEGUE CONTINUO (Únicamente rama main en push/merge)
  # Conexión SSH a VM en Google Cloud mediante appleboy/ssh-action
  # =========================================================================
  deploy:
    name: Despliegue en Google Cloud VM
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      # Conexión vía SSH hacia la Máquina Virtual en Google Cloud usando GitHub Secrets
      - name: Conexión y Despliegue en GCP vía SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=========================================================="
            echo "🚀 Iniciando despliegue de Soundwave Generator en GCP VM..."
            echo "=========================================================="
            
            # Placeholders de comandos para la máquina virtual de GCP:
            # 1. Navegar al directorio del proyecto en la VM
            # cd /opt/soundwave-generator || exit 1
            
            # 2. Descargar últimos cambios aprobados de la rama main
            # git checkout main
            # git pull origin main
            
            # 3. Reconstruir y levantar contenedores en segundo plano
            # docker compose down
            # docker compose up -d --build
            
            # 4. Verificación de salud del contenedor
            # docker ps | grep soundwave-frontend
            
            echo "✅ Pipeline de despliegue ejecutado con éxito."
